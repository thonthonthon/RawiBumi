name: validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schema-and-reference-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-validation.txt
      - run: python -m pip install -r apps/api/requirements.txt
      - run: npm install --no-audit --no-fund
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: python -m pytest -q
      - run: python tools/benchmark_phase58.py --quick
      - run: python tools/benchmark_phase58h.py --quick
      - run: python tools/benchmark_phase59.py --quick
      - run: python tools/validate_phase510.py
      - run: python tools/benchmark_phase511.py --quick
