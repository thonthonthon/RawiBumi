governing_interpretation:
  - Every frozen Phase-3.9 acceptance gate remains inside tolerance.
  - There is no first nonpassing stage under the frozen policy.
  - VC6 is the closest ordinary-clipping stage to its frozen gate, with about
    0.3994 percentage point difference against a 0.50 percentage point limit.
  - PVsyst ILPmxSH is the largest single grid-side missing model, about 3.825 MWh.
  - Removing source ILPmxSH only as an attribution aid reduces annual grid
    residual from about +1.598% to +0.103%.
  - EArray/DC-feedback semantics remain quantitatively dominant and must stay
    separate from OpenSIMPV AC clipping.
  - Exact canonical acceptance still requires execution of the external VC6 CSV
    through the repository NREL-SPA runtime.
