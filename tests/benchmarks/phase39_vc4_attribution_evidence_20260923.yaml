governing_interpretation:
  - Every frozen Phase-3.9 acceptance gate remains inside tolerance.
  - There is no first nonpassing stage under the frozen policy.
  - The raw +0.836% E_Grid residual is mainly explained by the missing PVsyst
    sub-hourly clipping correction, not by generic inverter conversion error.
  - Removing source ILPmxSH only as an attribution aid reduces the annual grid
    residual to about -0.015%.
  - EArray/DC-feedback semantics are materially active and must remain separate
    from OpenSIMPV AC clipping.
  - Exact canonical acceptance still requires execution of the external VC4 CSV
    through the repository NREL-SPA runtime.
