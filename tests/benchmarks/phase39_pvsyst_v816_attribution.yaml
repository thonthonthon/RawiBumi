schema_version: "0.1"
campaign_id: P39-PVSYST-V816-001
title: PVsyst 8.1.6 unshaded attribution campaign
status: framework_ready_acceptance_blocked_external_inputs

reference_family:
  family_id: SYS-PVSYST-V816-UNSHADED
  software: PVsyst
  software_version: "8.1.6"
  project: Sampel for OpenSimPV
  site_name: Home
  timezone: UTC+07:00
  weather_source: Meteonorm 9.0 dll, Sat=100% - Synthetic
  report_date: "2026-09-23"
  source_basis: user_supplied_pvsyst_reports
  source_pages_verified:
    main_results: 4
    loss_diagram: 5
  interval_weather_export_available: false
  detailed_timestep_result_export_available: false

comparison_policy:
  external_agreement_is_evidence_not_truth: true
  stage_order:
    - weather
    - poa_transposition
    - iam_effective_irradiance
    - module_nominal
    - irradiance_level
    - temperature
    - module_quality
    - mismatch
    - dc_wiring
    - array_virtual_mpp
    - inverter_conversion
    - inverter_clipping
    - grid_energy
    - performance_ratio
  first_divergence_controls_attribution: true
  later_stage_total_cannot_override_earlier_failure: true
  pvsyst_e_array_is_acceptance_target: false
  pvsyst_e_array_reason: >
    PVsyst EArray includes inverter operating-point displacement. The present
    OpenSIMPV chain keeps array virtual MPP and AC clipping explicit and does not
    back-propagate inverter clipping into a synthetic DC operating point.
  pvsyst_e_arr_mpp_mapping:
    opensimpv_metric: array_virtual_mpp_kwh
    status: comparable
  pvsyst_e_grid_mapping:
    opensimpv_metric: e_grid_kwh
    status: comparable
  performance_ratio_formula: E_Grid / (GlobInc * PNomArray)

  acceptance_tolerances:
    weather_annual:
      relative: 0.001
      absolute_kwh_m2: 0.2
    poa_annual:
      relative: 0.01
      absolute_kwh_m2: 1.0
    effective_irradiance_annual:
      relative: 0.01
      absolute_kwh_m2: 1.0
    array_nominal_energy:
      relative: 0.01
      absolute_kwh: 25.0
    stage_loss_percentage_points:
      absolute: 0.50
    array_virtual_mpp:
      relative: 0.02
      absolute_kwh: 50.0
    grid_energy:
      relative: 0.03
      absolute_kwh: 50.0
    performance_ratio:
      absolute: 0.03
    specific_yield:
      relative: 0.03
      absolute_kwh_kwp: 10.0
    monthly_grid:
      rms_relative: 0.03
      maximum_absolute_relative: 0.05

readiness_policy:
  hourly:
    requires_same_interval_weather_series: true
    requires_verified_subhourly_perez_coefficients: false
  minute:
    requires_same_interval_weather_series: true
    requires_verified_subhourly_perez_coefficients: true
  interval_attribution:
    requires_pvsyst_detailed_timestep_export: true
  source_report_verification_required: true

known_differences:
  - difference_id: KD-PEREZ-SUBHOURLY-COEFFICIENTS
    applies_to: minute
    classification: external_coefficient_data_blocker
    status: unresolved
    description: >
      Exact PVsyst 8.1 production Perez coefficients are timestep-specific and
      are not publicly available in the current documentation.
  - difference_id: KD-IAM-TCUBIC
    applies_to: all
    classification: known_implementation_difference
    status: attribute_separately
    description: >
      OpenSIMPV executes the PAN tabulated IAM through its versioned cubic
      interpolation path and does not claim exact PVsyst TCubicProfile internals.
  - difference_id: KD-OND-TCUBIC
    applies_to: all
    classification: known_implementation_approximation
    status: attribute_separately
    description: >
      OpenSIMPV inverter efficiency interpolation is versioned and bounded but
      is not claimed to reproduce PVsyst OND TCubicProfile exactly.
  - difference_id: KD-THERMAL-HISTORY-EDGE
    applies_to: all
    classification: compatibility_uncertainty
    status: attribute_separately
    description: >
      Exact PVsyst handling when the documented 3*tau_max thermal history
      cutoff is shorter than the simulation step is not publicly specified.
  - difference_id: KD-EARRAY-DC-FEEDBACK
    applies_to: all
    classification: architectural_model_difference
    status: excluded_from_acceptance_target
    description: >
      PVsyst EArray includes inverter operating-point displacement, while the
      present OpenSIMPV chain does not back-propagate inverter clipping into DC.
  - difference_id: KD-PVSYST-MN9-SERIES
    applies_to: all
    classification: external_input_blocker
    status: unresolved
    description: >
      The PVsyst reports identify integrated Meteonorm 9.0 weather but do not
      contain the interval weather series needed for same-input execution.

