  - family_id: SYS-PVSYST-V816-UNSHADED
    family_type: cross_software_end_to_end
    purpose: >
      External end-to-end validation across legacy hourly and modern native-minute
      PVsyst simulation with four DC/AC loading ratios.
    source:
      software: PVsyst
      software_version: "8.1.6"
      project: Sampel for OpenSimPV
      site_name: Home
      latitude_deg: -6.4245
      longitude_deg: 106.8307
      elevation_m: 82
      timezone: UTC+07:00
      albedo: 0.20
      weather_source: Meteonorm 9.0 dll, Sat=100% - Synthetic
      report_date: "2026-09-23"
      note: >
        Hourly and one-minute cases use the corresponding PVsyst/Meteonorm 9 temporal
        weather representation. They are not numerically interchangeable with the
        Meteonorm 8.2 standalone DAT family.
    shared_configuration:
      system_type: grid_connected
      no_3d_scene: true
      near_shading: none
      horizon: free
      orientation:
        type: fixed_plane
        tilt_deg: 20.0
        pvsyst_azimuth_deg: 0.0
        canonical_azimuth_deg: 0.0
        source_orientation_note: >
          For this southern-hemisphere PVsyst site, PVsyst azimuth 0 is the
          equator-facing north direction, equal to OpenSIMPV canonical azimuth 0.
      transposition:
        model: Perez
        model_id: poa.transposition.pvsyst81_perez.v0.1
        diffuse: Perez_Meteonorm
        circumsolar: separate
        hourly:
          timestep_seconds: 3600
          coefficient_basis: Perez_1990_allsitescomposite
          coefficient_status: executable
        subhourly:
          supported_timestep_rule: integer_divisor_of_3600_seconds
          production_coefficient_shape: [8, 6]
          production_coefficient_count: 48
          production_coefficients_publicly_documented: false
          exact_parity_status: blocked_pending_verified_numeric_table
          fallback_policy: fail_closed
          prohibited_silent_substitutes:
            - Perez_1990
            - Perez_Driesse
            - EUPVSEC_2023_proof_of_concept_minute_coefficients
        low_sun_cutoff:
          sun_height_deg_strictly_below: 2.0
          solar_height_basis: true_geometric
          zero_components:
            - beam
            - circumsolar
          preserve_components:
            - isotropic_diffuse
            - horizon_diffuse
            - ground_reflected
      module:
        model: JKM550M-72HL4-V
        pan_name: JKM550M-72HL4-V_SGS_6079M3.PAN
        unit_nominal_power_wp: 550
        width_m: 1.134
        height_m: 2.278
        area_m2: 2.583252
        mass_kg: 28.0
        unit_mass_kg_m2: 10.839050932700333
        stc_efficiency_fraction: 0.2129099290351851
        absorption_coefficient: 0.90
        electrical_model_id: module.pvsyst_singlediode.v6
        electrical_solver: lambertw
        electrical_inputs:
          irradiance: optical.effective_irradiance_w_m2
          temperature: thermal.cell_temperature_c
        electrical_outputs:
          - isc_a
          - voc_v
          - imp_a
          - vmp_v
          - pmp_w
          - module_efficiency_fraction
      inverter:
        model: SUN2000-100KTL-M1
        electrical_model_id: inverter.voltage_dependent_efficiency.v0.1
        nominal_ac_kw: 100
        max_ac_kw: 110
        max_power_temperature_c: 30.0
        nominal_power_temperature_c: 40.0
        high_temperature_limit1_c: 60.0
        high_temperature_limit1_kw: 36.0
        absolute_temperature_limit_c: 62.0
        runtime_temperature_basis: unresolved
        operating_voltage_v: [200, 1000]
        minimum_input_power_w: 500.0
        night_loss_w: 2.0
        efficiency_power_interpolation: bounded_linear_pin_pout_v0.1
        efficiency_power_above_curve_policy: hold_endpoint_efficiency
        efficiency_voltage_interpolation: bounded_quadratic_v0.1
        units: 1
        mppt_count: 10
        total_dc_input_count: 20
        input_count_per_mppt: null
        verified_mppt_operating_current_limit_a: null
        current_limit_runtime_policy: block_requires_full_iv_if_verified_limit_binds
        clipping_limit_without_runtime_temperature_w: 110000.0
        pvsyst_reported_zero_loss_channels_pct:
          max_input_current: 0.00
          over_nominal_input_voltage: 0.00
          power_threshold: 0.00
          voltage_threshold: 0.00
          night_consumption: 0.00
        topology_note: >
          The OND verifies 10 MPPTs and 20 total DC inputs, but does not establish
          a physical per-MPPT input count or per-MPPT operating-current limit.
          OpenSIMPV therefore does not infer those limits from 20/10. Temperature
          derating is applied only when a runtime temperature basis is explicitly
          resolved; otherwise the verified 110 kW maximum AC power is the clipping
          limit.
      modules_per_string: 18
      thermal:
        model: PVsyst_8.1_transient
        model_id: thermal.pvsyst81.prilliman_adapted.v0.1
        base_steady_state_model_id: thermal.pvsyst.pvlib.v0.1
        uc_w_m2k: 20.0
        uv_w_m2k_per_ms: 0.0
        irradiance_basis: incident_poa_global_before_iam
        module_efficiency_policy: dynamic_from_module_electrical_model
        transient_model:
          method: pvsyst_adapted_prilliman
          unit_mass_kg_m2: 10.839050932700333
          unit_mass_source: module_mass_divided_by_one_sided_area
          missing_or_invalid_mass_default_kg_m2: 11.0
          invalid_mass_threshold_kg_m2: 20.0
          wind_required_for_inertia: true
          relaxation_rate_equation: P=0.0046+0.00046*Ws-0.00023*mu-0.000016*Ws*mu
          cutoff_equation: 3_tau_max
          interval_output: analytical_interval_average
          cutoff_under_timestep_policy: always_include_immediate_previous_steady_state_sample
          cutoff_under_timestep_status: requires_phase39_attribution
        electrical_coupling:
          method: fixed_point_iteration
          temperature_state_used_by_sdm: transient_interval_average
          initial_efficiency_fraction: 0.0
          temperature_tolerance_c: 0.0001
          efficiency_tolerance_fraction: 1.0e-8
          max_iterations: 25
          relaxation_factor: 1.0
        note: >
          Phase 3.8B keeps the steady-state PVsyst heat balance as an explicit
          intermediate, then applies the documented PVsyst 8.1 adapted-Prilliman
          inertia model. The transient interval-average temperature is fed to the
          detailed single-diode model and the efficiency term is solved
          self-consistently. Exact PVsyst 8.1.6 behavior when 3*tau_max is shorter
          than the simulation step remains a Phase 3.9 attribution item.
      dc_wiring_loss_fraction_at_stc: 0.015
      module_quality_loss_fraction: -0.0075
      module_mismatch_loss_fraction: 0.02
      array_loss_execution:
        model_id: array_losses.explicit_mpp_i2r.v0.1
        module_quality:
          model: signed_mpp_power_fraction
          sign_convention: positive_loss_negative_gain
        module_mismatch:
          model: sequential_mpp_power_fraction
        string_mismatch:
          model: sequential_mpp_power_fraction
          fraction_source: per_case
        dc_wiring:
          model: global_equivalent_resistance_i2r
          resistance_source: per_case_dc_array_resistance_mohm
          stc_loss_fraction_role: reference_only_not_runtime_multiplier
          tracker_voltage_scope: common_active_mppt_voltage_required
        ordering:
          - module_quality
          - module_mismatch
          - string_mismatch
          - dc_wiring
      result_aggregation:
        interval_energy_model: interval_average_times_explicit_duration
        duration_source: case_simulation_resolution_seconds
        pcc_boundary: net_inverter_ac_output_no_downstream_ac_stage
        performance_ratio_irradiance_basis: incident_poa_global
        reference_irradiance_kw_m2: 1.0
        pvsyst_e_array_mapping_status: deferred
        pvsyst_e_array_note: >
          PVsyst EArray reflects the operating array output and can include DC
          operating-point feedback when inverter limiting binds. Phase 3.7 keeps
          array virtual MPP, AC clipping, and net AC output explicit but does not
          fabricate a DC EArray equivalent by back-converting AC clipping.
      temporal_execution:
        schema: TemporalExecutionContext.v0.1
        v1_target_timestep_seconds: [60, 300, 900, 3600]
        arbitrary_positive_interval_where_integer_ratio_supported: true
        resolution_conversion_stage: before_timeline_and_all_physics
        native_resolution_preserved: true
        source_origin_time_semantics_preserved: true
        interval_level_provenance: true
        working_series_origin_recorded: true
        provider_generated_subhourly_distinct_from_opensimpv_disaggregation: true
        opensimpv_disaggregation:
          algorithm: interval_mean_hold
          algorithm_version: "0.1"
          irradiance_energy_preserving: true
          fidelity: conservative_baseline
          false_precision_warning: required
          note: >
            The simulation specification prefers a future solar-geometry-informed
            normalized intrainterval shape. Exact hourly-to-minute shaping remains
            an open v0.2 decision, so Phase 3.8 does not silently invent one.
        native_pvsyst_reference_timesteps_seconds: [60, 3600]
        meteonorm82_weather_reference_timesteps_seconds: [60, 600, 900, 3600]
      iam_profile_type: TCubicProfile
      iam_interpolation_method: cubic
      iam_profile:
        - [0, 1.000]
        - [30, 1.000]
        - [50, 1.000]
        - [60, 0.999]
        - [70, 0.988]
        - [75, 0.965]
        - [80, 0.925]
        - [85, 0.743]
        - [90, 0.000]
      auxiliary_losses_configured: false
