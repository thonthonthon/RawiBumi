      latitude_deg: -6.425
      longitude_deg: 106.831
      elevation_m: 93
      timezone: UTC+07:00
      source_time_reference_minutes: -30
      calendar: yearless_typical_year
      note: >
        Meteonorm writes the latitude as -6.425 [deg N] in these files; the explicit
        negative numeric sign is authoritative.
    cases:
