schema_version: "0.1"
suite_id: P3-UNSHADED-001
title: Phase 3 unshaded simulation benchmark contract
status: accepted

benchmark_policy:
  external_agreement_is_evidence_not_truth: true
  do_not_tune_to_annual_energy_only: true
  uploaded_sources_redistributed: false
  source_weather_families_are_not_interchangeable: true
  notes:
    - Meteonorm 8.2 standalone DAT files are the controlled native-resolution weather family.
    - PVsyst V8.1.6 reports use integrated Meteonorm 9.0 weather and are a separate cross-software family.
    - Hourly/minute PVsyst pair differences are end-to-end temporal-resolution/weather-representation differences, not a pure numerical timestep delta.
    - PVsyst variant name NoLoss does not mean mathematically lossless; the reports retain IAM, thermal, module quality, mismatch, DC wiring, inverter conversion, and clipping where applicable.
    - The PVsyst reports do not expose individual string-to-MPPT wiring. Phase 3.5 uses an explicit balanced OpenSIMPV analytical assignment only to exercise identical-string topology; it is not claimed to reproduce PVsyst's internal wiring.
    - The OND efficiency source uses TCubicProfile internally, but the exact PVsyst cubic interpolation algorithm is not independently frozen. Phase 3.6 therefore uses a versioned bounded linear Pin/Pout interpolation between source points plus the canonical quadratic voltage interpolation; Phase 3.9 must attribute any residual rather than silently tune it.
    - The PVsyst reports show zero displayed losses for input-current, voltage, power-threshold, and night-consumption channels in all eight reference cases; those are comparison targets, not assumptions forced into OpenSIMPV.
    - The 1.50% DC wiring entry is a source STC reference used to derive/check the per-case global array resistance; runtime wiring loss is I²R from that resistance and is not a second 1.50% multiplier.
    - Phase 3.7 electrical reconciliation starts at detailed array MPP and ends at a PCC identity boundary equal to net inverter AC output. It does not yet add AC wiring, transformer, availability, curtailment, or plant auxiliary stages.
    - Phase 3.8 treats native weather resolution, current input-series resolution, and simulation timestep as separate metadata. Resolution conversion happens once before timeline and all physics.
    - Phase 3.8B targets the documented PVsyst 8.1 adapted-Prilliman transient module-temperature model for both hourly and sub-hourly simulation. The immediate-previous-state policy when the documented 3*tau_max cutoff is shorter than the simulation step remains an explicit 3.9 attribution item rather than a claimed reverse-engineered PVsyst internal detail.
    - Phase 3.8C provides a named PVsyst-8.1 Perez execution boundary and the documented HSol<2deg beam/circumsolar cutoff. Exact sub-hourly coefficient parity is not yet claimable because PVsyst publicly documents timestep-specific 48-coefficient production sets but does not publish their numeric tables; OpenSIMPV therefore fails closed rather than substituting Perez-1990, Perez-Driesse, or the older EUPVSEC-2023 prototype minute table.
    - OpenSIMPV hourly-to-subhourly interval_mean_hold remains an explicitly low-fidelity, energy-preserving disaggregation baseline; it is never relabeled as measured or provider-native minute weather.
    - Meteonorm 8.2 standalone 1/10/15/60-minute data are weather-resolution references only. The PVsyst simulation oracle supplied here contains Meteonorm 9 hourly and native 1-minute cases only; no 10/15-minute PVsyst oracle is implied.

